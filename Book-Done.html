<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home Hunt KH - Booking Done</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        /* GENERAL */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #effcf9,
                #e4f8f5,
                #f7fffd
            );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;

            color: #176b68;
        }


        /* BACKGROUND DECORATION */

        body::before {
            content: "🌿";

            position: fixed;

            left: 20px;
            bottom: 20px;

            font-size: 100px;

            opacity: 0.12;

            transform: rotate(-30deg);

            pointer-events: none;
        }

        body::after {
            content: "🌿";

            position: fixed;

            right: 20px;
            bottom: 20px;

            font-size: 100px;

            opacity: 0.12;

            transform: rotate(30deg);

            pointer-events: none;
        }


        /* MAIN CONTAINER */

        .confirmation-card {

            width: 100%;
            max-width: 890px;

            background: white;

            border-radius: 12px;

            padding: 35px 50px 25px;

            box-shadow: 0 8px 30px rgba(25, 100, 90, 0.06);

            position: relative;

            z-index: 1;

        }


        /* SUCCESS ICON */

        .success-icon {

            width: 72px;
            height: 72px;

            border-radius: 50%;

            background: #238783;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 48px;

            font-weight: 700;

            margin: 0 auto 15px;

        }


        /* TITLE */

        .heading {

            text-align: center;

            margin-bottom: 24px;

        }

        .heading h1 {

            color: #075b59;

            font-size: 34px;

            font-weight: 800;

            line-height: 1.3;

        }

        .heading p {

            color: #668787;

            font-size: 17px;

            font-weight: 500;

        }


        /* CONTENT */

        .confirmation-content {

            display: grid;

            grid-template-columns: 1fr 1.4fr;

            gap: 28px;

            align-items: center;

        }


        /* HOUSE IMAGE */

        .house-image {

            width: 100%;
            height: 185px;

            border-radius: 10px;

            overflow: hidden;

        }

        .house-image img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

        }


        /* BOOKING DETAILS */

        .booking-details {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }

        .detail-row {

            display: grid;

            grid-template-columns: 25px 135px 1fr;

            align-items: center;

            gap: 8px;

            color: #367d79;

        }

        .detail-icon {

            font-size: 20px;

        }

        .detail-label {

            font-size: 15px;

            font-weight: 600;

        }

        .detail-value {

            font-size: 15px;

            font-weight: 600;

            color: #286d69;

        }


        /* BUTTONS */

        .buttons {

            display: flex;

            justify-content: flex-end;

            gap: 20px;

            margin-top: 30px;

        }

        .btn {

            width: 275px;

            height: 45px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            border-radius: 5px;

            text-decoration: none;

            font-size: 15px;

            font-weight: 600;

            transition: 0.3s;

        }


        /* VIEW LISTINGS BUTTON */

        .btn-primary {

            background: #19736f;

            color: white;

            border: 2px solid #19736f;

        }

        .btn-primary:hover {

            background: #105d59;

        }


        /* BACK HOME BUTTON */

        .btn-outline {

            background: white;

            color: #247b77;

            border: 2px solid #247b77;

        }

        .btn-outline:hover {

            background: #eaf8f6;

        }


        /* ======================
           TABLET
        ====================== */

        @media (max-width: 768px) {

            .confirmation-card {

                padding: 30px 25px;

            }

            .heading h1 {

                font-size: 28px;

            }

            .heading p {

                font-size: 14px;

            }

            .confirmation-content {

                grid-template-columns: 1fr;

                gap: 22px;

            }

            .house-image {

                height: 230px;

            }

            .buttons {

                gap: 12px;

            }

            .btn {

                width: 50%;

                font-size: 13px;

            }

        }


        /* ======================
           MOBILE
        ====================== */

        @media (max-width: 480px) {

            body {

                padding: 15px;

            }

            .confirmation-card {

                padding: 25px 18px;

            }

            .success-icon {

                width: 65px;
                height: 65px;

                font-size: 40px;

            }

            .heading h1 {

                font-size: 23px;

            }

            .heading p {

                font-size: 12px;

            }

            .house-image {

                height: 190px;

            }

            .detail-row {

                grid-template-columns: 24px 100px 1fr;

                gap: 5px;

            }

            .detail-label,
            .detail-value {

                font-size: 11px;

            }

            .detail-icon {

                font-size: 16px;

            }

            .buttons {

                flex-direction: column;

                gap: 10px;

            }

            .btn {

                width: 100%;

                height: 45px;

                font-size: 13px;

            }

        }

    </style>

</head>


<body>


    <!-- MAIN CONFIRMATION CARD -->

    <main class="confirmation-card">


        <!-- SUCCESS ICON -->

        <div class="success-icon">
            ✓
        </div>


        <!-- HEADING -->

        <div class="heading">

            <h1>Your Visit Is Booked!</h1>

            <p>
                Thank you for choosing Home KH.
                We'll contact you to confirm the visit.
            </p>

        </div>



        <!-- BOOKING CONTENT -->

        <div class="confirmation-content">


            <!-- HOUSE IMAGE -->

            <div class="house-image">

                <img
                    src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=900&q=80"
                    alt="Modern House"
                >

            </div>



            <!-- BOOKING DETAILS -->

            <div class="booking-details">


                <!-- PROPERTY -->

                <div class="detail-row">

                    <span class="detail-icon">⌂</span>

                    <span class="detail-label">
                        Property
                    </span>

                    <span class="detail-value">
                        Modern House in Phnom Penh
                    </span>

                </div>



                <!-- DATE -->

                <div class="detail-row">

                    <span class="detail-icon">▦</span>

                    <span class="detail-label">
                        Date
                    </span>

                    <span class="detail-value">
                        May 25, 2026
                    </span>

                </div>



                <!-- TIME -->

                <div class="detail-row">

                    <span class="detail-icon">◷</span>

                    <span class="detail-label">
                        Times
                    </span>

                    <span class="detail-value">
                        10:00 AM - 11:00 AM
                    </span>

                </div>



                <!-- VISITORS -->

                <div class="detail-row">

                    <span class="detail-icon">♙</span>

                    <span class="detail-label">
                        Visitors
                    </span>

                    <span class="detail-value">
                        2 people
                    </span>

                </div>



                <!-- PHONE NUMBER -->

                <div class="detail-row">

                    <span class="detail-icon">☎️</span>

                    <span class="detail-label">
                        Contact Number
                    </span>

                    <span class="detail-value">
                        +855 976827633
                    </span>

                </div>


            </div>

        </div>



        <!-- BUTTONS -->

        <div class="buttons">


            <a href="listings.html" class="btn btn-primary">

                ☷ View Listings

            </a>


            <a href="index.html" class="btn btn-outline">

                ⌂ Back to Home

            </a>


        </div>


    </main>


</body>

</html>
